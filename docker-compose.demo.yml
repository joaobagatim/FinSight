name: finsight-demo

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    container_name: finsight-demo-postgres
    environment:
      POSTGRES_DB: finsight_demo
      POSTGRES_USER: finsight_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Initialize the local demo first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:5544:5432'
    volumes:
      - demo_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'finsight_demo', '-d', 'finsight_demo']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

volumes:
  demo_data:
    name: finsight-demo-data

networks:
  default:
    name: finsight-demo-net
    ipam:
      config:
        - subnet: 172.30.254.0/24
