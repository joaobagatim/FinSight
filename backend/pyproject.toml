[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight API infrastructure"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pwdlib[argon2]>=0.3,<1",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<3",
    "pip>=25,<26",
    "pip-tools>=7,<8",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
markers = ["postgres: integration tests using a dedicated temporary PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pip-tools.compile]
allow-unsafe = true
generate-hashes = true
strip-extras = true
emit-index-url = false
emit-trusted-host = false
