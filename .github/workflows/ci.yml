name: Phase 0 checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_DB: finsight_ci
          POSTGRES_USER: finsight_ci
          # Synthetic credential for this disposable CI service only.
          POSTGRES_PASSWORD: ci-only-synthetic-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finsight_ci -d finsight_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINSIGHT_ENVIRONMENT: test
      FINSIGHT_DB_HOST: 127.0.0.1
      FINSIGHT_DB_PORT: '5433'
      FINSIGHT_DB_NAME: finsight_ci
      FINSIGHT_DB_USER: finsight_ci
      FINSIGHT_DB_PASSWORD: ci-only-synthetic-password
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements-dev.txt
          backend/.venv/bin/python -m pip check
      - name: Lint and check backend formatting
        run: |
          backend/.venv/bin/python -m ruff check backend
          backend/.venv/bin/python -m ruff format --check backend
      - name: Run backend tests with PostgreSQL
        run: >-
          backend/.venv/bin/python -m pytest -c backend/pyproject.toml backend/tests
          --run-postgres --junitxml=test-results/pytest.xml
      - name: Retain backend test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-report
          path: test-results/pytest.xml
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use project npm version
        run: npm install --global npm@11.11.0 --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend quality and build
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run format:check
          npm --prefix frontend run build

  playwright:
    name: Playwright checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Use project npm version
        run: npm install --global npm@11.11.0 --no-audit --no-fund
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies for the isolated API
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements-dev.txt
          backend/.venv/bin/python -m pip check
      - name: Install test and frontend dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Check automation quality
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run API and browser tests
        run: npm test
      - name: Run session API and browser tests with owned PostgreSQL
        run: |
          backend/.venv/bin/python -m ruff check tests/support/session-api.py
          backend/.venv/bin/python -m ruff format --check tests/support/session-api.py
          npm run test:auth
      - name: Retain Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
